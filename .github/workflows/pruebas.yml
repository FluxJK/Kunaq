name: Pruebas
on: [push, pull_request]
jobs:
  nube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/prueba_nube.py sqlite
